<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PageFlow — Page & Product Manager</title>
  <style>
    :root {
      --ink: #18233b;
      --muted: #718096;
      --line: #e7ebf2;
      --blue: #2f6bff;
      --purple: #7357ff;
      --bg: #f6f8fc;
      --card: #fff;
    }

    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 95% 3%, rgba(133, 92, 246, .17), transparent 26rem),
        radial-gradient(circle at 2% 45%, rgba(47, 107, 255, .1), transparent 24rem),
        var(--bg);
      font-family: "Google Sans", "Product Sans", "Noto Sans Thai", Arial, sans-serif;
    }
    button, input, select, textarea { font: inherit; }
    button { color: inherit; }
    .container { width: min(1500px, calc(100% - 48px)); margin: auto; }

    .topbar {
      min-height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(224, 230, 240, .9);
    }
    .brand, .top-actions, .flex { display: flex; align-items: center; }
    .brand { gap: 12px; }
    .logo {
      width: 43px; height: 43px;
      display: grid; place-items: center;
      color: white; border-radius: 14px;
      background: linear-gradient(145deg, var(--blue), #8958ff);
      box-shadow: 0 10px 24px rgba(47, 107, 255, .25);
      font-size: 21px;
    }
    .brand strong { display: block; font-size: 17px; }
    .brand small { color: #8b96a8; font-size: 11px; }
    .top-actions { gap: 12px; }
    .autosave { color: #8490a4; font-size: 12px; }
    .autosave::before {
      content: ""; display: inline-block; width: 7px; height: 7px;
      margin-right: 8px; border-radius: 50%; background: #1fb984;
      box-shadow: 0 0 0 4px rgba(31, 185, 132, .1);
    }

    .btn {
      min-height: 42px; padding: 0 16px;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      border: 1px solid transparent; border-radius: 12px;
      cursor: pointer; font-weight: 700; font-size: 13px;
      transition: .18s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn.primary {
      color: white; background: linear-gradient(135deg, var(--blue), #6258ff);
      box-shadow: 0 9px 22px rgba(47, 107, 255, .22);
    }
    .btn.secondary { color: #46536a; border-color: #dfe5ef; background: rgba(255,255,255,.85); }

    .card {
      border: 1px solid rgba(228, 233, 242, .9);
      background: rgba(255,255,255,.96);
      box-shadow: 0 16px 42px rgba(31,50,81,.07);
      border-radius: 22px;
      margin-top: 30px; 
    }
    .controls { padding: 22px 24px 0; }
    .search-grid {
      display: grid; grid-template-columns: 1fr 1.15fr 1fr auto;
      align-items: end; gap: 14px;
    }
    label.field { display: grid; gap: 8px; }
    label.field > span { color: #536077; font-size: 12px; font-weight: 700; }
    .input-wrap {
      height: 44px; padding: 0 13px; display: flex; align-items: center; gap: 9px;
      color: #9aa5b7; border: 1px solid #e3e8f0; border-radius: 12px; background: #f9fafc;
    }
    .input-wrap:focus-within { border-color: rgba(47,107,255,.55); box-shadow: 0 0 0 4px rgba(47,107,255,.08); background: white; }
    .input-wrap input { width: 100%; height: 100%; padding: 0; outline: 0; border: 0; background: transparent; color: #28354d; font-size: 13px; }
    ::placeholder { color: #aeb7c6; }
    .tabs {
      min-height: 64px; margin-top: 18px;
      display: flex; align-items: center; gap: 6px; overflow-x: auto;
      border-top: 1px solid #edf0f5; scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .filter-title { margin-right: 5px; color: #8b96a9; font-size: 11px; font-weight: 700; white-space: nowrap; }
    .tab {
      height: 35px; padding: 0 10px; display: inline-flex; align-items: center; gap: 7px;
      flex: none; border: 1px solid transparent; border-radius: 10px;
      color: #657188; background: transparent; cursor: pointer; font-size: 11px; font-weight: 700;
    }
    .tab:hover { background: #f6f8fb; }
    .tab.active { color: var(--status, var(--blue)); border-color: color-mix(in srgb, var(--status, var(--blue)) 20%, transparent); background: var(--soft, #edf3ff); }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--status, currentColor); }
    .count { min-width: 20px; padding: 3px 6px; border-radius: 999px; background: rgba(109,124,149,.09); font-size: 9px; text-align: center; }
    .clear { margin-left: auto; border: 0; background: transparent; color: var(--blue); cursor: pointer; font-size: 11px; font-weight: 700; white-space: nowrap; }

    .table-card { margin: 18px 0 44px; overflow: hidden; }
    .table-head {
      min-height: 76px; padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid #edf0f5;
    }
    .table-head h2 { margin: 0 0 3px; font-size: 15px; }
    .table-head p { margin: 0; color: #929daf; font-size: 11px; }
    .hint { color: #929daf; font-size: 10px; }
    .table-scroll { overflow-x: auto; }
    table { width: 100%; min-width: 1240px; border-collapse: collapse; }
    th {
      height: 45px; padding: 0 13px; color: #8793a8;
      border-bottom: 1px solid #edf0f5; background: #fafbfd;
      font-size: 9px; font-weight: 800; letter-spacing: .07em; text-align: left;
    }
    
    /* เพิ่มลูกเล่นเวลาเมาส์ชี้ และคลิกเลือกบรรทัด */
    td { padding: 13px; border-bottom: 1px solid #eff2f6; color: #3f4b62; font-size: 12px; vertical-align: middle; cursor: pointer; }
    tbody tr { transition: background-color 0.2s ease; }
    tbody tr:hover { background-color: #f0f4ff; } 
    tbody tr.selected { background-color: #e6edff; } /* สีเมื่อถูกเลือก */

    .center { text-align: center; }
    .no { padding-left: 22px; color: #a3adbd; font-size: 10px; font-weight: 700; }
    .sku-list { max-width: 210px; display: flex; flex-wrap: wrap; gap: 5px; }
    .sku {
      padding: 4px 7px; color: #3e66ce; border: 1px solid #dce7ff;
      border-radius: 7px; background: #f2f6ff; font-size: 9px; font-weight: 800;
    }
    .page-name { min-width: 180px; font-weight: 700; }
    .copy-row { display: flex; align-items: center; gap: 5px; }
    .icon-btn {
      width: 32px; height: 32px; display: inline-grid; place-items: center;
      border: 0; border-radius: 9px; color: #8d99ab; background: transparent;
      cursor: pointer; text-decoration: none; font-size: 15px;
    }
    .icon-btn:hover { color: var(--blue); background: #edf3ff; }
    .icon-btn.fb { color: white; background: var(--blue); box-shadow: 0 6px 13px rgba(47,107,255,.18); }
    .icon-btn.chat { color: var(--blue); background: #edf3ff; }
    .link-buttons { display: flex; justify-content: center; gap: 3px; }
    .status {
      min-width: 92px; min-height: 27px; padding: 0 9px;
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      color: var(--status); border: 1px solid color-mix(in srgb, var(--status) 15%, transparent);
      border-radius: 999px; background: var(--soft); font-size: 9px; font-weight: 800;
    }
    .id-button {
      padding: 7px 8px; display: inline-flex; align-items: center; gap: 7px;
      border: 0; border-radius: 8px; color: #738099; background: #f6f8fb;
      cursor: pointer; font-size: 10px;
    }
    .edit {
      height: 33px; padding: 0 11px; border: 1px solid #e1e6ef;
      border-radius: 9px; color: #5f6d83; background: white; cursor: pointer; font-size: 10px; font-weight: 700;
    }
    .empty { padding: 70px 20px; text-align: center; color: #8b96a8; }

    .modal-backdrop {
      position: fixed; z-index: 20; inset: 0; padding: 24px;
      display: none; place-items: center;
      background: rgba(15,23,42,.52); backdrop-filter: blur(6px);
    }
    .modal-backdrop.show { display: grid; }
    .modal {
      width: min(590px, 100%); max-height: calc(100vh - 48px); overflow: auto;
      border-radius: 24px; background: white; box-shadow: 0 30px 80px rgba(15,23,42,.27);
      animation: appear .2s ease;
    }
    .modal-header {
      min-height: 86px; padding: 20px 22px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid #edf0f5;
    }
    .modal-title { display: flex; align-items: center; gap: 12px; }
    .modal-badge { width: 42px; height: 42px; display: grid; place-items: center; color: var(--blue); border-radius: 13px; background: #edf3ff; font-size: 20px; }
    .modal-title p, .modal-title h2 { margin: 0; }
    .modal-title p { margin-bottom: 3px; color: #7c3aed; font-size: 9px; font-weight: 800; letter-spacing: .1em; }
    .modal-title h2 { font-size: 17px; }
    .close { border: 0; background: transparent; color: #8290a4; cursor: pointer; font-size: 23px; }
    .form { padding: 23px; display: grid; gap: 18px; }
    .form-field { display: grid; gap: 8px; }
    .form-field span { color: #536077; font-size: 12px; font-weight: 700; }
    .form-field b { color: #f05663; }
    .form input, .form textarea, .form select, .status-create input[type="text"] {
      width: 100%; outline: 0; border: 1px solid #e0e6ef; border-radius: 11px;
      color: #2d3a51; background: #fafbfd; font-size: 13px;
    }
    .form input, .form select, .status-create input[type="text"] { height: 45px; padding: 0 13px; }
    .form textarea { padding: 12px 13px; resize: vertical; }
    .form input:focus, .form textarea:focus, .form select:focus { border-color: rgba(47,107,255,.6); box-shadow: 0 0 0 4px rgba(47,107,255,.08); background: white; }
    .form-grid { display: grid; grid-template-columns: 1.25fr 1fr; gap: 13px; }
    .link-preview { padding: 13px; border: 1px solid #e0e8ff; border-radius: 12px; background: #f7f9ff; color: #60708d; font-size: 10px; overflow: hidden; }
    .link-preview div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin: 4px 0; }
    .actions { display: flex; justify-content: flex-end; gap: 9px; }

    .status-list { padding: 18px 22px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .status-item {
      min-height: 44px; padding: 0 12px; display: grid; grid-template-columns: auto 1fr auto;
      align-items: center; gap: 9px; border: 1px solid #e8ecf3; border-radius: 11px; background: #fbfcfe;
    }
    .swatch { width: 11px; height: 11px; border-radius: 50%; }
    .status-item strong { font-size: 11px; }
    .status-item small { color: #96a0b1; font-size: 9px; }
    .status-create { padding: 19px 22px 22px; border-top: 1px solid #edf0f5; background: #fafbfe; }
    .status-create h3 { margin: 0 0 12px; font-size: 12px; }
    .status-row { display: grid; grid-template-columns: 48px 1fr auto; gap: 9px; }
    input[type="color"] { width: 48px; height: 45px; padding: 4px; border: 1px solid #dfe5ee; border-radius: 11px; background: white; cursor: pointer; }

    .toast {
      position: fixed; z-index: 50; left: 50%; bottom: 26px;
      min-height: 48px; padding: 0 18px; display: none; align-items: center;
      transform: translateX(-50%); color: white; border-radius: 14px;
      background: #17223a; box-shadow: 0 16px 40px rgba(15,23,42,.3);
      font-size: 12px; font-weight: 700;
    }
    .toast.show { display: flex; animation: toast .2s ease; }
    @keyframes appear { from { opacity: 0; transform: translateY(8px) scale(.98); } }
    @keyframes toast { from { opacity: 0; transform: translate(-50%, 8px); } }

    @media (max-width: 1100px) {
      .search-grid { grid-template-columns: 1fr 1fr; }
      .search-grid .btn { width: 100%; }
    }
    @media (max-width: 760px) {
      .container { width: calc(100% - 24px); }
      .autosave { display: none; }
      .top-actions .btn { width: 42px; padding: 0; font-size: 0; }
      .top-actions .btn::before { content: "🎨"; font-size: 17px; }
      .controls { padding: 18px 16px 0; }
      .search-grid, .form-grid, .status-list { grid-template-columns: 1fr; }
      .hint { display: none; }
      .modal-backdrop { padding: 12px; align-items: end; }
      .modal { max-height: calc(100vh - 24px); border-radius: 24px 24px 18px 18px; }
      .status-row { grid-template-columns: 48px 1fr; }
      .status-row .btn { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <header class="container topbar">
    <div class="brand">
      <div class="logo">◇</div>
      <div><strong>PageFlow</strong><small>Commerce workspace</small></div>
    </div>
    <div class="top-actions">
      <span class="autosave">บันทึกอัตโนมัติ</span>
      <button class="btn secondary" id="manageStatusBtn">🎨 จัดการสถานะ</button>
    </div>
  </header>

  <main class="container">
    <section class="card controls">
      <div class="search-grid">
        <label class="field"><span>ค้นหาชื่อ SKU</span><div class="input-wrap">⌕<input id="skuSearch" placeholder="เช่น SP001"></div></label>
        <label class="field"><span>ค้นหาชื่อเพจ</span><div class="input-wrap">⌕<input id="pageSearch" placeholder="พิมพ์ชื่อเพจ..."></div></label>
        <label class="field"><span>ค้นหาลิงก์ / ID Page</span><div class="input-wrap">🔗<input id="linkSearch" inputmode="numeric" placeholder="กรอกตัวเลข ID"></div></label>
        <button class="btn primary" id="addBtn">＋ เพิ่มเพจและสินค้าใหม่</button>
      </div>
      <div class="tabs" id="statusTabs"></div>
    </section>

    <section class="card table-card">
      <div class="table-head">
        <div><h2>รายการเพจและสินค้า</h2><p id="resultCount"></p></div>
        <span class="hint">📋 กดไอคอนเพื่อคัดลอก</span>
      </div>
      <div class="table-scroll">
        <table>
          <thead><tr>
            <th>No.</th><th>SKU</th><th>ชื่อเพจ</th><th>STATUS</th>
            <th class="center">Facebook Chat</th><th class="center">Link Page</th>
            <th>ID PAGE</th><th>จัดการ</th>
          </tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div class="empty" id="emptyState" hidden>ไม่พบข้อมูลที่ค้นหา<br><small>ลองเปลี่ยนคำค้นหา หรือเลือกสถานะอื่น</small></div>
    </section>
  </main>

  <div class="modal-backdrop" id="editorModal">
    <section class="modal">
      <div class="modal-header">
        <div class="modal-title"><div class="modal-badge" id="editorIcon">＋</div><div><p id="editorEyebrow">NEW PAGE</p><h2 id="editorTitle">เพิ่มเพจและสินค้าใหม่</h2></div></div>
        <button class="close" data-close="editorModal">×</button>
      </div>
      <form class="form" id="pageForm">
        <label class="form-field"><span>ชื่อเพจ <b>*</b></span><input id="pageName" required placeholder="เช่น กระดาษ 001"></label>
        <label class="form-field"><span>SKU สินค้า <b>*</b></span><textarea id="skuText" required rows="3" placeholder="SP001, SP002, SP003"></textarea></label>
        <div class="form-grid">
          <label class="form-field"><span>ID PAGE <b>*</b></span><input id="pageId" required inputmode="numeric" pattern="[0-9]+" placeholder="กรอกตัวเลข ID Page"></label>
          <label class="form-field"><span>สถานะ</span><select id="statusSelect"></select></label>
        </div>
        <div class="link-preview" id="linkPreview" hidden></div>
        <div class="actions"><button type="button" class="btn secondary" data-close="editorModal">ยกเลิก</button><button class="btn primary" type="submit">✓ บันทึกข้อมูล</button></div>
      </form>
    </section>
  </div>

  <div class="modal-backdrop" id="statusModal">
    <section class="modal">
      <div class="modal-header">
        <div class="modal-title"><div class="modal-badge">🎨</div><div><p>STATUS SETTINGS</p><h2>จัดการสถานะ</h2></div></div>
        <button class="close" data-close="statusModal">×</button>
      </div>
      <div class="status-list" id="statusList"></div>
      <form class="status-create" id="statusForm">
        <h3>＋ เพิ่มสถานะใหม่</h3>
        <div class="status-row">
          <input type="color" id="statusColor" value="#7c3aed" title="เลือกสีสถานะ">
          <input type="text" id="statusName" required placeholder="ชื่อสถานะใหม่">
          <button class="btn primary" type="submit">เพิ่มสถานะ</button>
        </div>
      </form>
    </section>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const defaultStatuses = [
      { id: "new", label: "เพิ่มใหม่", color: "#ff6b6b" },
      { id: "active", label: "Active ADS", color: "#18a875" },
      { id: "non-active", label: "NON Active", color: "#f59e0b" },
      { id: "old-page", label: "เพจเก่า", color: "#ff7a45" },
      { id: "sold-out", label: "ของหมด", color: "#8b5cf6" },
      { id: "discontinued", label: "เลิกขาย", color: "#64748b" }
    ];

    const defaultRows = [
      { id: "1", skus: ["SP001","SP002"], pageName: "กระดาษ 001", pageId: "376914915504136", statusId: "active" },
      { id: "2", skus: ["SP001","SP003","SP004"], pageName: "กล่องใส่ทิชชู่ตั้งโต๊ะ", pageId: "409762088890359", statusId: "non-active" },
      { id: "3", skus: ["KT018"], pageName: "ตะแกรงติดก๊อกน้ำ", pageId: "398294160042800", statusId: "old-page" },
      { id: "4", skus: ["BE021","BE024"], pageName: "ถุงมือช่างครบเซ็ต", pageId: "411320932070884", statusId: "sold-out" },
      { id: "5", skus: ["HL007"], pageName: "กระเป๋าเครื่องสำอาง", pageId: "457780684079682", statusId: "active" },
      { id: "6", skus: ["FT112","FT115"], pageName: "เครื่องทวิสต์พร้อมเชือกดึง", pageId: "406199945916799", statusId: "new" }
    ];

    let statuses = load("pageflow-statuses", defaultStatuses);
    let rows = load("pageflow-rows", defaultRows);
    let activeStatus = "all";
    let editingId = null;

    const $ = id => document.getElementById(id);
    const esc = value => String(value).replace(/[&<>"']/g, char => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;" }[char]));
    const soft = (hex, opacity = .1) => {
      const value = hex.replace("#", "");
      const r = parseInt(value.slice(0,2),16), g = parseInt(value.slice(2,4),16), b = parseInt(value.slice(4,6),16);
      return `rgba(${r},${g},${b},${opacity})`;
    };
    const chatLink = id => `https://www.facebook.com/latest/inbox/all?asset_id=${id}`;
    const pageLink = id => `https://www.facebook.com/${id}`;

    function load(key, fallback) {
      try { return JSON.parse(localStorage.getItem(key)) || fallback; }
      catch { return fallback; }
    }
    function save() {
      localStorage.setItem("pageflow-statuses", JSON.stringify(statuses));
      localStorage.setItem("pageflow-rows", JSON.stringify(rows));
    }
    function counts() {
      return rows.reduce((all, row) => {
        all.all = (all.all || 0) + 1;
        all[row.statusId] = (all[row.statusId] || 0) + 1;
        return all;
      }, {});
    }
    function filteredRows() {
      const sku = $("skuSearch").value.trim().toLowerCase();
      const page = $("pageSearch").value.trim().toLowerCase();
      const link = $("linkSearch").value.replace(/\D/g, "");
      return rows.filter(row =>
        (activeStatus === "all" || row.statusId === activeStatus) &&
        (!sku || row.skus.some(item => item.toLowerCase().includes(sku))) &&
        (!page || row.pageName.toLowerCase().includes(page)) &&
        (!link || row.pageId.includes(link))
      );
    }
    function render() {
      const count = counts();
      const filtered = filteredRows();
      $("resultCount").textContent = `แสดง ${filtered.length} จาก ${rows.length} รายการ`;

      $("statusTabs").innerHTML = `
        <span class="filter-title">☰ สถานะ</span>
        <button class="tab ${activeStatus === "all" ? "active" : ""}" data-status="all">ทั้งหมด <span class="count">${count.all || 0}</span></button>
        ${statuses.map(s => `<button class="tab ${activeStatus === s.id ? "active" : ""}" data-status="${esc(s.id)}" style="--status:${s.color};--soft:${soft(s.color)}"><i class="dot"></i>${esc(s.label)} <span class="count">${count[s.id] || 0}</span></button>`).join("")}
        <button class="clear" id="clearBtn">ล้างตัวกรอง</button>`;

      $("tableBody").innerHTML = filtered.map((row, index) => {
        const status = statuses.find(s => s.id === row.statusId) || statuses[0];
        return `<tr data-row-id="${row.id}">
          <td class="no">${String(index + 1).padStart(2, "0")}</td>
          <td><div class="sku-list">${row.skus.map(s => `<span class="sku">${esc(s)}</span>`).join("")}</div></td>
          <td><div class="copy-row page-name"><span>${esc(row.pageName)}</span><button class="icon-btn" data-copy="${esc(row.pageName)}" title="คัดลอกชื่อเพจ">📋</button></div></td>
          <td><span class="status" style="--status:${status.color};--soft:${soft(status.color)}"><i class="dot"></i>${esc(status.label)}</span></td>
          <td class="center"><div class="link-buttons"><a class="icon-btn chat" href="${chatLink(row.pageId)}" target="_blank" title="เปิด Facebook Chat">☵</a><button class="icon-btn" data-copy="${chatLink(row.pageId)}" title="คัดลอกลิงก์ Chat">📋</button></div></td>
          <td class="center"><div class="link-buttons"><a class="icon-btn fb" href="${pageLink(row.pageId)}" target="_blank" title="เปิด Facebook Page">f</a><button class="icon-btn" data-copy="${pageLink(row.pageId)}" title="คัดลอกลิงก์เพจ">📋</button></div></td>
          <td><button class="id-button" data-copy="${row.pageId}">${row.pageId} 📋</button></td>
          <td><button class="edit" data-edit="${row.id}">✎ แก้ไข</button></td>
        </tr>`;
      }).join("");
      $("emptyState").hidden = filtered.length > 0;
      bindDynamicEvents();
    }

    function bindDynamicEvents() {
      document.querySelectorAll("[data-status]").forEach(button => button.onclick = () => { activeStatus = button.dataset.status; render(); });
      
      // ฟังก์ชันคลิกเลือกแถวตาราง
      document.querySelectorAll("#tableBody tr").forEach(row => {
          row.addEventListener("click", function(e) {
              if(e.target.closest('button') || e.target.closest('a')) return; 
              document.querySelectorAll("#tableBody tr").forEach(r => r.classList.remove("selected"));
              this.classList.add("selected");
          });
      });

      document.querySelectorAll("[data-copy]").forEach(button => button.onclick = () => copy(button.dataset.copy));
      document.querySelectorAll("[data-edit]").forEach(button => button.onclick = () => openEditor(button.dataset.edit));
      $("clearBtn").onclick = () => {
        $("skuSearch").value = $("pageSearch").value = $("linkSearch").value = "";
        activeStatus = "all"; render();
      };
    }
    function copy(value) {
      navigator.clipboard.writeText(value).then(() => toast("✓ คัดลอกข้อมูลแล้ว")).catch(() => toast("ไม่สามารถคัดลอกได้"));
    }
    function toast(message) {
      $("toast").textContent = message;
      $("toast").classList.add("show");
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => $("toast").classList.remove("show"), 2200);
    }
    function openModal(id) { $(id).classList.add("show"); }
    function closeModal(id) { $(id).classList.remove("show"); }

    function updateStatusSelect(selected) {
      $("statusSelect").innerHTML = statuses.map(s => `<option value="${esc(s.id)}" ${s.id === selected ? "selected" : ""}>${esc(s.label)}</option>`).join("");
    }
    function openEditor(id = null) {
      editingId = id;
      const row = rows.find(item => item.id === id);
      $("editorEyebrow").textContent = row ? "EDIT PAGE" : "NEW PAGE";
      $("editorTitle").textContent = row ? "แก้ไขข้อมูลเพจ" : "เพิ่มเพจและสินค้าใหม่";
      $("editorIcon").textContent = row ? "✎" : "＋";
      $("pageName").value = row?.pageName || "";
      $("skuText").value = row?.skus.join(", ") || "";
      $("pageId").value = row?.pageId || "";
      updateStatusSelect(row?.statusId || statuses[0]?.id);
      updatePreview();
      openModal("editorModal");
      setTimeout(() => $("pageName").focus(), 80);
    }
    function updatePreview() {
      const id = $("pageId").value.replace(/\D/g, "");
      $("pageId").value = id;
      $("linkPreview").hidden = !id;
      $("linkPreview").innerHTML = id ? `<div>💬 ${chatLink(id)}</div><div>f ${pageLink(id)}</div>` : "";
    }

    $("pageForm").onsubmit = event => {
      event.preventDefault();
      const skus = $("skuText").value.split(/[,\n]/).map(v => v.trim()).filter(Boolean);
      const data = {
        id: editingId || String(Date.now()),
        pageName: $("pageName").value.trim(),
        skus,
        pageId: $("pageId").value.replace(/\D/g, ""),
        statusId: $("statusSelect").value
      };
      if (editingId) rows = rows.map(row => row.id === editingId ? data : row);
      else rows.unshift(data);
      save(); closeModal("editorModal"); render();
      toast(editingId ? "✓ บันทึกการแก้ไขแล้ว" : "✓ เพิ่มข้อมูลใหม่แล้ว");
    };

    function renderStatusList() {
      const count = counts();
      $("statusList").innerHTML = statuses.map(s => `<div class="status-item"><i class="swatch" style="background:${s.color}"></i><strong>${esc(s.label)}</strong><small>${count[s.id] || 0} รายการ</small></div>`).join("");
    }
    $("statusForm").onsubmit = event => {
      event.preventDefault();
      const label = $("statusName").value.trim();
      statuses.push({ id: `status-${Date.now()}`, label, color: $("statusColor").value });
      $("statusName").value = "";
      save(); renderStatusList(); render(); toast(`✓ เพิ่มสถานะ “${label}” แล้ว`);
    };

    ["skuSearch","pageSearch","linkSearch"].forEach(id => $(id).addEventListener("input", render));
    $("pageId").addEventListener("input", updatePreview);
    $("addBtn").onclick = () => openEditor();
    $("manageStatusBtn").onclick = () => { renderStatusList(); openModal("statusModal"); };
    document.querySelectorAll("[data-close]").forEach(button => button.onclick = () => closeModal(button.dataset.close));
    document.querySelectorAll(".modal-backdrop").forEach(backdrop => backdrop.addEventListener("mousedown", event => {
      if (event.target === backdrop) closeModal(backdrop.id);
    }));
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") document.querySelectorAll(".modal-backdrop.show").forEach(modal => closeModal(modal.id));
    });

    render();
  </script>
</body>
</html>
