<div class="modal fade" id="pricesModal" tabindex="-1">
    <div class="modal-dialog" style="max-width:520px">
        <div class="modal-content" style="border-radius:1.5rem;overflow:hidden">
            <div class="d-flex justify-content-between align-items-start p-4" style="background:#0f172a;color:white">
                <div>
                    <div class="fw-bold" style="font-size:.95rem">ตั้งค่าราคาทดสอบ</div>
                    <div style="font-size:.7rem;color:#94a3b8;margin-top:2px">รหัสสินค้า: {{ product.pid }} — {{ product.name }}</div>
                </div>
                <button class="btn-close btn-close-white" data-bs-dismiss="modal" style="font-size:.7rem"></button>
            </div>

            <form method="post"
                  action="{% url 'product_prices' product.pk %}"
                  hx-post="{% url 'product_prices' product.pk %}"
                  hx-target="#modal-container"
                  hx-swap="innerHTML">
                {% csrf_token %}
                <div class="p-4" style="background:#f8fafc">
                    <div class="text-center py-2 mb-3 rounded-3" style="background:#4f46e5">
                        <span style="font-size:.85rem;font-weight:700;color:white">
                            <i class="fa-solid fa-tag me-2"></i>ราคาทดสอบสินค้า
                        </span>
                    </div>

                    <div id="price-rows-p" class="d-flex flex-column gap-2">
                        {% for pr in prices %}
                        <div class="d-flex gap-2 align-items-center price-row-p rounded-3 p-2"
                             style="background:white;border:1px solid #e2e8f0;transition:border-color .15s"
                             onmouseover="this.style.borderColor='#a5b4fc'"
                             onmouseout="this.style.borderColor='#e2e8f0'">
                            <div class="flex-grow-1">
                                <input type="text" class="form-control form-control-sm price-inp-p fw-bold"
                                       value="{{ pr.value }}" placeholder="ระบุราคาทดสอบ..."
                                       style="background:#f8fafc;border-color:#e2e8f0;color:#4f46e5;font-size:.85rem">
                            </div>
                            <div class="d-flex gap-1">
                                <button type="button" class="btn btn-sm rounded-2 border"
                                        onclick="copyPriceRow(this)"
                                        style="width:36px;height:36px;background:#f8fafc;color:#94a3b8;border-color:#e2e8f0"
                                        onmouseover="this.style.background='#eef2ff';this.style.color='#4f46e5'"
                                        onmouseout="this.style.background='#f8fafc';this.style.color='#94a3b8'"
                                        title="คัดลอกราคา">
                                    <i class="fa-regular fa-copy" style="font-size:.75rem"></i>
                                </button>
                                <button type="button" class="btn btn-sm rounded-2 border"
                                        onclick="this.closest('.price-row-p').remove()"
                                        style="width:36px;height:36px;background:#f8fafc;color:#94a3b8;border-color:#e2e8f0"
                                        onmouseover="this.style.background='#fff1f2';this.style.color='#f43f5e'"
                                        onmouseout="this.style.background='#f8fafc';this.style.color='#94a3b8'"
                                        title="ลบรายการ">
                                    <i class="fa-solid fa-trash-can" style="font-size:.75rem"></i>
                                </button>
                            </div>
                        </div>
                        {% empty %}
                        <div class="d-flex gap-2 align-items-center price-row-p rounded-3 p-2"
                             style="background:white;border:1px solid #e2e8f0">
                            <div class="flex-grow-1">
                                <input type="text" class="form-control form-control-sm price-inp-p fw-bold"
                                       placeholder="ระบุราคาทดสอบ..."
                                       style="background:#f8fafc;border-color:#e2e8f0;color:#4f46e5;font-size:.85rem">
                            </div>
                            <div class="d-flex gap-1">
                                <button type="button" class="btn btn-sm rounded-2 border" onclick="copyPriceRow(this)"
                                        style="width:36px;height:36px;background:#f8fafc;color:#94a3b8;border-color:#e2e8f0">
                                    <i class="fa-regular fa-copy" style="font-size:.75rem"></i>
                                </button>
                                <button type="button" class="btn btn-sm rounded-2 border" onclick="this.closest('.price-row-p').remove()"
                                        style="width:36px;height:36px;background:#f8fafc;color:#94a3b8;border-color:#e2e8f0">
                                    <i class="fa-solid fa-trash-can" style="font-size:.75rem"></i>
                                </button>
                            </div>
                        </div>
                        {% endfor %}
                    </div>

                    <button type="button" onclick="addPriceRowP()" class="w-100 mt-3 py-2 rounded-3 fw-bold"
                            style="border:2px dashed #c7d2fe;background:white;color:#4f46e5;font-size:.8rem;transition:all .15s"
                            onmouseover="this.style.background='#eef2ff';this.style.borderColor='#4f46e5'"
                            onmouseout="this.style.background='white';this.style.borderColor='#c7d2fe'">
                        <i class="fa-solid fa-plus-circle me-1"></i>เพิ่มแถวราคาทดสอบ
                    </button>
                    <input type="hidden" name="prices_json" id="prices-json-p">
                </div>

                <div class="p-3 d-flex justify-content-between align-items-center" style="background:white;border-top:1px solid #f1f5f9">
                    <button type="button" class="btn btn-sm fw-bold"
                            onclick="document.getElementById('price-rows-p').innerHTML=''"
                            style="background:#fff1f2;color:#f43f5e;font-size:.75rem">
                        <i class="fa-solid fa-trash-can me-1"></i>ลบทั้งหมด
                    </button>
                    <div class="d-flex gap-2">
                        <button type="button" class="btn btn-sm fw-bold" data-bs-dismiss="modal"
                                style="background:#f1f5f9;color:#475569;font-size:.75rem">ยกเลิก</button>
                        <button type="submit" class="btn btn-sm fw-bold" onclick="collectPricesP()"
                                style="background:#059669;color:white;font-size:.75rem">
                            <i class="fa-solid fa-floppy-disk me-1"></i>บันทึกข้อมูล
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
<script>
function addPriceRowP() {
    const d = document.createElement('div');
    d.className = 'd-flex gap-2 align-items-center price-row-p rounded-3 p-2';
    d.style.cssText = 'background:white;border:1px solid #e2e8f0;transition:border-color .15s';
    d.onmouseover = () => d.style.borderColor = '#a5b4fc';
    d.onmouseout  = () => d.style.borderColor = '#e2e8f0';
    d.innerHTML = `
        <div class="flex-grow-1">
            <input type="text" class="form-control form-control-sm price-inp-p fw-bold"
                   placeholder="ระบุราคาทดสอบ..."
                   style="background:#f8fafc;border-color:#e2e8f0;color:#4f46e5;font-size:.85rem">
        </div>
        <div class="d-flex gap-1">
            <button type="button" class="btn btn-sm rounded-2 border" onclick="copyPriceRow(this)"
                    style="width:36px;height:36px;background:#f8fafc;color:#94a3b8;border-color:#e2e8f0"
                    onmouseover="this.style.background='#eef2ff';this.style.color='#4f46e5'"
                    onmouseout="this.style.background='#f8fafc';this.style.color='#94a3b8'" title="คัดลอก">
                <i class="fa-regular fa-copy" style="font-size:.75rem"></i>
            </button>
            <button type="button" class="btn btn-sm rounded-2 border" onclick="this.closest('.price-row-p').remove()"
                    style="width:36px;height:36px;background:#f8fafc;color:#94a3b8;border-color:#e2e8f0"
                    onmouseover="this.style.background='#fff1f2';this.style.color='#f43f5e'"
                    onmouseout="this.style.background='#f8fafc';this.style.color='#94a3b8'" title="ลบ">
                <i class="fa-solid fa-trash-can" style="font-size:.75rem"></i>
            </button>
        </div>`;
    document.getElementById('price-rows-p').appendChild(d);
}

function copyPriceRow(btn) {
    const val = btn.closest('.price-row-p').querySelector('.price-inp-p').value.trim();
    if (!val) { showToast('ไม่มีข้อมูลให้คัดลอก', 'error'); return; }
    navigator.clipboard.writeText(val).then(() => showToast('คัดลอก: ' + val));
}

function collectPricesP() {
    const prices = [];
    document.querySelectorAll('.price-inp-p').forEach(i => { const v = i.value.trim(); if (v) prices.push(v); });
    document.getElementById('prices-json-p').value = JSON.stringify(prices);
}
</script>
