<!-- Read-only info / media viewer -->
<div class="modal fade" id="infoModal" tabindex="-1">
    <div class="modal-dialog modal-lg" style="max-width:620px">
        <div class="modal-content" style="border-radius:1rem;overflow:hidden">
            <div class="d-flex justify-content-between align-items-center p-3" style="background:#0f172a;color:white">
                <h6 class="mb-0 fw-bold" style="font-size:.85rem">
                    <i class="fa-solid fa-circle-info me-2"></i>ข้อมูลสินค้า / ข้อมูลสื่อ — {{ product.pid }}
                </h6>
                <button class="btn-close btn-close-white" data-bs-dismiss="modal" style="font-size:.65rem"></button>
            </div>

            <div class="p-4 d-flex flex-column gap-3">
                <!-- ข้อมูลสินค้า (info) -->
                <div>
                    <div class="fw-bold mb-2" style="font-size:.72rem;color:#475569;text-transform:uppercase;letter-spacing:.05em">
                        <i class="fa-solid fa-tag me-1" style="color:#4f46e5"></i>ข้อมูลสินค้า
                    </div>
                    <div class="p-3 rounded-3" style="background:#f8fafc;border:1px solid #e2e8f0;font-size:.82rem;color:#334155;white-space:pre-wrap;min-height:48px">
                        {{ product.info|default:"-" }}
                    </div>
                </div>

                <!-- ข้อมูลสื่อ (detail) -->
                <div>
                    <div class="fw-bold mb-2" style="font-size:.72rem;color:#475569;text-transform:uppercase;letter-spacing:.05em">
                        <i class="fa-solid fa-photo-film me-1" style="color:#059669"></i>ข้อมูลสื่อ / หมายเหตุ
                    </div>
                    <div class="p-3 rounded-3" style="background:#f8fafc;border:1px solid #e2e8f0;font-size:.82rem;color:#334155;white-space:pre-wrap;min-height:48px">
                        {{ product.detail|default:"-" }}
                    </div>
                </div>

                <div class="pt-2 text-end" style="border-top:1px solid #f1f5f9">
                    <button class="btn btn-sm fw-bold" data-bs-dismiss="modal"
                            style="background:#f1f5f9;color:#475569;font-size:.75rem">ปิดหน้าต่าง</button>
                </div>
            </div>
        </div>
    </div>
</div>
