<div class="modal fade" id="viewRefModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable modal-dialog-centered">
        <div class="modal-content rounded-4 border-0 shadow-lg">
            <div class="modal-header text-white border-0" style="background:#0f172a">
                <h5 class="modal-title fw-bold" style="font-size:.9rem">
                    <i class="fa-solid fa-book-open me-2"></i>ข้อมูลสื่ออ้างอิง
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <p class="text-muted mb-3 small">
                    <strong>{{ job.sku }}</strong> — {{ job.name }}
                </p>

                {% if refs %}
                <div class="row g-3">
                    {% for ref in refs %}
                    <div class="col-12 col-sm-6">
                        <div class="rounded-3 overflow-hidden" style="border:1px solid #e2e8f0">
                            <a href="{{ ref.image.url }}" target="_blank">
                                <img src="{{ ref.image.url }}"
                                     style="width:100%;height:180px;object-fit:cover;display:block">
                            </a>
                            {% if ref.brief %}
                            <div class="p-2" style="background:#f8fafc">
                                <p class="mb-0 small text-dark" style="font-size:.78rem;white-space:pre-wrap">{{ ref.brief }}</p>
                            </div>
                            {% else %}
                            <div class="p-2" style="background:#f8fafc">
                                <p class="mb-0 text-muted" style="font-size:.72rem">(ไม่มี brief สำหรับรูปนี้)</p>
                            </div>
                            {% endif %}
                        </div>
                    </div>
                    {% endfor %}
                </div>
                {% else %}
                <div class="text-center py-5 text-muted">
                    <i class="fa-regular fa-image fa-2x mb-2 d-block opacity-30"></i>
                    <p class="small">ไม่มีรูปภาพอ้างอิงแนบ</p>
                </div>
                {% endif %}
            </div>
            <div class="modal-footer border-0" style="background:#f8fafc">
                <button type="button" class="btn btn-light btn-sm fw-bold" data-bs-dismiss="modal">ปิดหน้าต่าง</button>
            </div>
        </div>
    </div>
</div>
