{% if video_types %}
<div class="mb-2">
    <h6 class="text-danger fw-bold mb-2" style="font-size:.72rem">1. งานคลิป</h6>
    <div class="ps-1">
        {% for mt in video_types %}
        <div class="form-check mb-1">
            <input class="form-check-input" type="checkbox"
                   name="media_type_ids"
                   value="{{ mt.pk }}"
                   id="mt-{{ mt.pk }}"
                   {% if mt.pk in checked_ids %}checked{% endif %}>
            <label class="form-check-label small" for="mt-{{ mt.pk }}">{{ mt.name }}</label>
        </div>
        {% endfor %}
    </div>
</div>
{% endif %}

{% if image_types %}
<div>
    <h6 class="text-primary fw-bold mb-2" style="font-size:.72rem">2. งานรูปภาพ</h6>
    <div class="ps-1">
        {% for mt in image_types %}
        <div class="form-check mb-1">
            <input class="form-check-input" type="checkbox"
                   name="media_type_ids"
                   value="{{ mt.pk }}"
                   id="mt-{{ mt.pk }}"
                   {% if mt.pk in checked_ids %}checked{% endif %}>
            <label class="form-check-label small" for="mt-{{ mt.pk }}">{{ mt.name }}</label>
        </div>
        {% endfor %}
    </div>
</div>
{% endif %}

{% if not video_types and not image_types %}
<p class="text-muted small">ยังไม่มีประเภทสื่อ — เพิ่มด้วยช่องด้านล่าง</p>
{% endif %}
