server {
    listen 80;
    server_name _;  # Replace _ with your server IP or domain, e.g.: server_name 1.2.3.4;

    client_max_body_size 20M;

    # User-uploaded media — served directly by Nginx, bypassing Gunicorn
    location /uploads/ {
        alias /srv/mos-cms/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Everything else → Gunicorn (static files handled by WhiteNoise inside Django)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
